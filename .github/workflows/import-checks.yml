name: import checks

# 这棵树是「重组 + 改名」出来的产物，最容易坏的形状是静态可判的：
# 重复绑定（Bun 解析报错）、改名只改了一半（导出面不匹配）、
# 搬文件时漏了随行依赖（相对路径落不到文件）。
# 它们在运行时只表现为一句 `Claude Code could not start: BuildMessage`
# 外加 10 秒看门狗，所以放在 CI 里，用秒级的静态检查拦住。
#
# 覆盖范围与「未检查项」见 README 的「CI（import 检查）」一节。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 固定版本：Bun.Transpiler 的行为随版本变，检查结果要可复现。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # 纯静态，不执行树里的代码，也不读 node_modules。
      # 末尾的 --runtime 额外把单独拉起的 hooks worker 真跑一次；
      # 这一步依赖运行时环境，若在 CI 里不稳就直接去掉这个参数。
      - name: 解析 / 依赖边 / 导出面 / 单独入口
        run: bun .analysis/check-imports.mjs --runtime

      # 上面那条只看 .js 之间的引用，看不见索引与磁盘脱节。
      # 实测已经脱节过一次：file-map.json 里某条记录的 path 指向一个早已改名的文件。
      - name: 索引与磁盘一致
        run: bun .analysis/move/check-index.mjs

      # 两类懒加载的解析基准，上面那条的正则都覆盖不到：
      # `importMetaRequire("./x")` 相对捕获 import.meta.require 的模块所在目录解析（不是调用方）；
      # `readEmbeddedAsset*("./x", import.meta.dirname)` 是普通字符串字面量，根本不是 import。
      - name: 懒加载解析基准
        run: bun .analysis/move/check-lazy-base.mjs

      # 上面三道看的都是引用**关系**（能不能解析、落不落得到文件、导出面对不对），
      # 没有一道在看「这个标识符有没有定义」。实测因此炸过两次，都是运行时报错才发现：
      # shell-utils.js 的 `WZt`（拆分时定义留在了 execution-core.js）、
      # execution-core.js 的 `yr`（改名 yr → slugify 只改了一半，同文件里混用）。
      # 这条用 oxlint 的 no-undef 兜住，只对**新引入**的报错 —— 既存债务记在脚本的
      # KNOWN 里，修一条删一条。
      - name: 悬空的自由标识符
        run: bun .analysis/check-undef.mjs

      # 上面四道都建立在「specifier 能解析」这个前提上：check-imports 的**依赖边集合里
      # 根本不会有解析不到的边**，所以断链对它完全不可见。
      # 实测：2763e4ac 把 `00-第三方库/_未识别/第三方库-AWSSDK/` 下的 18 个 chunk 提了一层
      # （98% 相似度重命名 —— 内容没动，specifier 也没动），`../../https-proxy-agent/…`
      # 从「指向 00-第三方库/」变成「指向仓库根」。这些边是懒加载/动态 import 的，
      # `bun run` 只在走到那条路径时才炸，于是藏了三天，直到 `bun build` 追边才暴露。
      # 只对**树内断链**失败；经过悬空符号链接的（外部依赖没装）与 `.original.js`
      # 参考副本只报告，不计入失败。
      - name: 相对 specifier 断链
        run: bun .analysis/check-dangling.mjs
